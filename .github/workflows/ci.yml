# Builds the app and runs both test suites on every push.
#
# Order matters: the Android tests write a packet signed exactly as the phone
# signs, and the bank's interop test then verifies that same file. Running
# them in one job keeps the two halves of the wire format honest.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Android — unit tests, APK, lint
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug

      - name: Mock bank — rules, HTTP, receipts, Android interop
        working-directory: mock-bank
        run: npm test

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bouncepay-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
